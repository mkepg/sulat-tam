services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sulat_tam
      MYSQL_USER: sulattam
      MYSQL_PASSWORD: sulattam
    ports:
      # Host port 3307, not 3306: a locally-installed MySQL already occupies
      # 3306 on this machine, and that is common enough elsewhere that binding
      # it would make `docker compose up` fail on a stranger's laptop. Nothing
      # in the stack needs this mapping — the API reaches the database as
      # `db:3306` on the compose network — it exists only so a developer can
      # attach a GUI client.
      - "3307:3306"
    volumes:
      # MySQL runs this directory in lexical order, so schema must sort first.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: sulattam
      DB_PASS: sulattam
      DB_NAME: sulat_tam
      JWT_SECRET: local-development-secret-do-not-use-in-production
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: no-reply@sulattam.local
      # Base URL written into verification email links. Must point at the API,
      # since verify.php is a backend endpoint. Added in Task 2 after the
      # original hardcoded the now-dead alwaysdata host into the email body.
      APP_URL: http://localhost:8080
      # localhost:5173 -> localhost:8080 is same-site (ports are not part of a
      # site), so Lax cookies are sent. Secure=false is required over plain HTTP.
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: Lax
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:80"

  web:
    image: node:22
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  db_data:
